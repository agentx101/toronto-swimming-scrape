<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toronto Swim, Skate & Program Finder</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Toronto Swim, Skate & Program Finder</h1>
      <p>Enter your address to see nearby programs and schedules.</p>
    </header>

    <main>
      <section class="controls">
        <label for="address">Your address</label>
        <div class="row">
          <input id="address" type="text" placeholder="e.g. 100 Queen St W, Toronto" />
          <button id="searchBtn">Find Nearby</button>
        </div>

        <div class="row">
          <label for="radiusKm">Radius (km)</label>
          <input id="radiusKm" type="number" min="1" max="30" step="1" value="8" />
        </div>

        <div class="row filter-grid">
          <div>
            <label for="programScope">Program scope</label>
            <select id="programScope">
              <option value="all">All programs</option>
              <option value="dropin">Drop-in activities</option>
              <option value="registered">Registered programs</option>
            </select>
          </div>
          <div>
            <label><input id="dropinOnly" type="checkbox" /> Drop-in only</label>
          </div>
          <div>
            <label for="activityTypeFilter">Activity type</label>
            <select id="activityTypeFilter"><option value="all">All activity types</option></select>
          </div>
          <div>
            <label for="programDate">Program date (optional)</label>
            <input id="programDate" type="date" />
          </div>
          <div>
            <label for="startTime">Start time (optional)</label>
            <input id="startTime" type="time" />
          </div>
          <div>
            <label for="endTime">End time (optional)</label>
            <input id="endTime" type="time" />
          </div>
        </div>

        <div class="row">
          <label for="activityFilter">Activities (optional, multi-select)</label>
        </div>
        <div class="row">
          <select id="activityFilter" multiple size="8"></select>
        </div>
        <div class="row">
          <label><input id="kidOnly" type="checkbox" /> Only young-kid activities</label>
        </div>

        <p id="status" class="status">Loading data...</p>
      </section>

      <section id="map"></section>
      <section id="results" class="results"></section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
